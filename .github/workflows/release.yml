name: Release

# Triggers on a tag push like `v0.2.0`. The workflow:
#   1. Creates a draft GitHub Release for the tag
#   2. Builds the codetainyrrr binary for every supported OS/arch in parallel
#   3. Uploads each binary as a release asset with a stable, predictable name
#   4. Marks the release as not-draft once all builds succeed
#
# Asset naming matches the README's download examples:
#   codetainyrrr-linux-x86_64
#   codetainyrrr-linux-aarch64
#   codetainyrrr-macos-x86_64
#   codetainyrrr-macos-aarch64
#   codetainyrrr-windows-x86_64.exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Create the draft release once, before the build matrix runs ────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          version="${tag#v}"
          # Pull lines between `## [<version>]` and the next `## [` header.
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { capture=1; next }
            capture && /^## \[/    { exit }
            capture                { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $tag" > release_notes.md
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          body_path: release_notes.md
          draft: true
          prerelease: false

  # ── Build a binary for every supported (OS, arch) ──────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl for static binaries — no glibc version drift.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset:  codetainyrrr-linux-x86_64
            cross:  false
            apt:    musl-tools

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset:  codetainyrrr-linux-aarch64
            cross:  true

          # macOS: native arm64 builder for both targets (Xcode cross-compiles).
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset:  codetainyrrr-macos-x86_64
            cross:  false

          - target: aarch64-apple-darwin
            runner: macos-latest
            asset:  codetainyrrr-macos-aarch64
            cross:  false

          # Windows: native MSVC.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset:  codetainyrrr-windows-x86_64.exe
            cross:  false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install apt packages
        if: matrix.apt && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin codetainyrrr

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} --bin codetainyrrr

      - name: Stage binary as ${{ matrix.asset }}
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/codetainyrrr"
          if [ "${{ runner.os }}" = "Windows" ]; then src="${src}.exe"; fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"
          ls -lh dist/

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  # ── Publish: flip the release from draft to public once all builds pass ──
  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release public
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
