# ── task.install-runtime ──────────────────────────────────────────────────────
# Installs podman (recommended) or docker via the host package manager.
# Used when neither runtime is present, or when the user wants to switch.
# Native PowerShell on Windows (no sh dependency); shell on Linux/macOS.

[task.install-runtime]
description = "Install a container runtime (podman recommended; docker also supported)"

[[task.install-runtime.steps]]
type   = "shell"
script = """
set -a
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"
set +a
CHOICE="${CODETAINYRRR_RUNTIME:-}"
# 'auto' (or empty) → if anything already installed, no-op; else install podman.
if [ -z "$CHOICE" ] || [ "$CHOICE" = "auto" ]; then
    if command -v podman >/dev/null 2>&1 || command -v docker >/dev/null 2>&1; then
        echo "A container runtime is already installed; nothing to do."
        exit 0
    fi
    CHOICE="podman"
fi
case "$CHOICE" in
    podman|docker) ;;
    *) echo "Invalid CODETAINYRRR_RUNTIME='$CHOICE' (expected: podman|docker|auto)" >&2; exit 1 ;;
esac

OS="$(uname -s)"
case "$OS" in
    Linux*)
        if [ "$CHOICE" = "podman" ]; then
            if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y podman
            elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y podman
            elif command -v pacman >/dev/null 2>&1; then
                sudo pacman -S --noconfirm podman
            elif command -v zypper >/dev/null 2>&1; then
                sudo zypper install -y podman
            else
                echo "Unknown Linux distro — install podman manually: https://podman.io/docs/installation" >&2
                exit 1
            fi
        else
            echo "Docker on Linux: follow https://docs.docker.com/engine/install/ for your distro." >&2
            exit 1
        fi
        ;;
    Darwin*)
        if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew not found — install from https://brew.sh first." >&2
            exit 1
        fi
        if [ "$CHOICE" = "podman" ]; then
            brew install podman
            podman machine init 2>/dev/null || true
            podman machine start 2>/dev/null || true
            # `podman ps` exit code is the truth (machine start can report 125
            # even when the VM came up). On failure kill an orphan gvproxy (holds
            # the SSH socket) and retry once.
            if ! podman ps >/dev/null 2>&1; then
                pkill -f gvproxy 2>/dev/null || true
                podman machine stop 2>/dev/null || true
                podman machine start 2>/dev/null || true
            fi
            if ! podman ps >/dev/null 2>&1; then
                echo "podman machine did not reach a running state; check 'podman machine logs'." >&2
                exit 1
            fi
        else
            brew install --cask docker
            echo "Launch Docker Desktop from /Applications to start the daemon."
        fi
        ;;
    *)
        echo "Unsupported OS '$OS' — install $CHOICE manually." >&2
        exit 1
        ;;
esac
echo ""
echo "Installed $CHOICE. Re-run 'codetainyrrr setup' or 'codetainyrrr task doctor' to verify."
"""

[[task.install-runtime.os.windows]]
type   = "shell"
script = """
# Source .env so a prior 'setup' selection auto-feeds this task.
$envFile = Join-Path $env:USERPROFILE '.codetainyrrr\\.env'
if (Test-Path $envFile) {
    Get-Content $envFile | Where-Object { $_ -match '^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(.*)\\s*$' } | ForEach-Object {
        $k = $matches[1]; $v = $matches[2].Trim('"').Trim("'")
        Set-Item -Path "env:$k" -Value $v
    }
}
$choice = if ($env:CODETAINYRRR_RUNTIME) { $env:CODETAINYRRR_RUNTIME } else { '' }
# 'auto' (or empty): if anything already installed, no-op; else install podman.
if ($choice -eq '' -or $choice -eq 'auto') {
    if ((Get-Command podman -ErrorAction SilentlyContinue) -or (Get-Command docker -ErrorAction SilentlyContinue)) {
        Write-Host "A container runtime is already installed; nothing to do."
        exit 0
    }
    $choice = 'podman'
}
if ($choice -ne 'podman' -and $choice -ne 'docker') {
    Write-Host "Invalid CODETAINYRRR_RUNTIME='$choice' (expected: podman|docker|auto)" -ForegroundColor Red
    exit 1
}
if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
    Write-Host "winget not found. Install 'App Installer' from the Microsoft Store, then retry." -ForegroundColor Red
    exit 1
}
# Pin --source winget to skip the msstore source, which has SSL cert issues on
# some hosts (0x8a15005e). Both packages are available from the winget source.
# winget will trigger UAC for the install itself; everything after runs as the
# normal user (wsl -u root makes us root INSIDE the distro, not on Windows).
if ($choice -eq 'podman') {
    # Skip install if already present (idempotent re-runs).
    if (Get-Command podman -ErrorAction SilentlyContinue) {
        Write-Host "podman already installed: $((Get-Command podman).Source)"
    } else {
        winget install --id RedHat.Podman -e --source winget --accept-source-agreements --accept-package-agreements
        if ($LASTEXITCODE -ne 0) {
            Write-Host "winget install failed (exit $LASTEXITCODE)" -ForegroundColor Red
            exit 1
        }
        # Refresh PATH from registry so we can call podman in this same shell.
        $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
    }

    # Connectivity probe: `podman ps` exits 0 ONLY if the VM socket answers. We
    # trust this over `podman machine start`'s exit code, which returns 125
    # ('machine not in running state') even when the VM actually came up. (Note:
    # `podman version --format` is NOT usable here — it exits 0 with empty output
    # when the server is down.)
    function Test-PodmanReady {
        podman ps *>$null
        return ($LASTEXITCODE -eq 0)
    }
    # Drop stale VM + orphan proxies. A win-sshproxy/gvproxy left running while
    # the machine is stopped holds the SSH pipe/port, so the next start can never
    # complete the SSH transition. Killing them before each attempt is the fix.
    function Clear-PodmanState {
        podman machine stop 2>$null | Out-Null
        wsl --terminate podman-machine-default 2>$null | Out-Null
        Get-Process win-sshproxy,gvproxy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 1
    }
    # On some hosts the VM "flaps" — reachable for ~10s after start, then the SSH
    # proxy collapses (typically Docker Desktop coexistence). A single probe would
    # falsely pass, so we require the socket to STILL answer after a settle delay
    # before declaring success — otherwise task.run would `podman load` a 115 MB
    # image into a dying VM. On a healthy host this just costs one settle wait.
    function Confirm-PodmanStable {
        if (-not (Test-PodmanReady)) { return $false }
        Start-Sleep -Seconds 20
        return (Test-PodmanReady)
    }

    # Already reachable? install-runtime is a no-op (task.run calls it every run).
    if (Test-PodmanReady) {
        Write-Host "podman machine already running."
        Write-Host ""
        Write-Host "Podman ready. Verify: podman ps"
        exit 0
    }

    # Init the machine if it doesn't exist yet.
    $machines = podman machine list --format {% raw %}'{{.Name}}'{% endraw %} 2>$null | ForEach-Object { $_.Trim() -replace '\\*$','' }
    if ($machines -notcontains 'podman-machine-default') {
        Write-Host ""
        Write-Host "Initialising podman machine (downloads ~750 MB on first run)..."
        podman machine init
        if ($LASTEXITCODE -ne 0) {
            Write-Host "podman machine init failed (exit $LASTEXITCODE)" -ForegroundColor Red
            exit 1
        }
    } else {
        Write-Host "podman machine 'podman-machine-default' already exists; reusing"
    }

    # Patch /etc/wsl.conf inside the distro to enable systemd (idempotent grep
    # guard). Without this, sshd never starts → the SSH transition times out.
    # `wsl -u root` is root-inside-the-distro; no Windows UAC needed.
    Write-Host ""
    Write-Host "Ensuring systemd is enabled in the WSL distro..."
    wsl -d podman-machine-default -u root bash -c "grep -q '^\\s*systemd\\s*=\\s*true' /etc/wsl.conf 2>/dev/null || { printf '\\n[boot]\\nsystemd=true\\n' >> /etc/wsl.conf; echo 'wsl.conf: enabled systemd'; }"

    # Rootless start: up to 3 clean+start+confirm-stable cycles.
    $ready = $false
    for ($i = 1; $i -le 3 -and -not $ready; $i++) {
        Write-Host "Starting podman machine (attempt $i/3)..."
        Clear-PodmanState
        podman machine start
        if (Confirm-PodmanStable) { $ready = $true; break }
        Write-Host "  not stable yet; cleaning stale state and retrying..." -ForegroundColor Yellow
    }

    # Rootful auto-fallback: rootless never stabilised, so switch the machine to
    # rootful (a different SSH/user mapping + socket) and try once more. task.run
    # detects rootful via `podman machine inspect` and drops --userns=keep-id.
    if (-not $ready) {
        Write-Host "Rootless start unstable; switching machine to rootful and retrying..." -ForegroundColor Yellow
        podman machine stop 2>$null | Out-Null
        podman machine set --rootful
        Clear-PodmanState
        podman machine start
        if (Confirm-PodmanStable) { $ready = $true }
    }

    if (-not $ready) {
        Write-Host ""
        Write-Host "podman machine could not reach a running state." -ForegroundColor Red
        # The #1 silent cause on Windows: the WSL Hyper-V firewall (often forced
        # by 3rd-party security suites like Avast/Norton) blocks host->guest
        # inbound, so the VM boots fine but the SSH transition never connects.
        # Detect it: ActiveStore Block while the saved default is Allow == an app
        # is overriding it at runtime.
        $fwBlocked = $false
        try {
            $fw = Get-NetFirewallHyperVVMSetting -PolicyStore ActiveStore -ErrorAction Stop |
                  Where-Object { $_.Name -eq '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}' }
            if ($fw -and $fw.DefaultInboundAction -eq 'Block') { $fwBlocked = $true }
        } catch {}
        if ($fwBlocked) {
            Write-Host "Cause: the WSL Hyper-V firewall is BLOCKING host->guest traffic" -ForegroundColor Red
            Write-Host "(commonly forced by Avast/Norton/3rd-party firewalls)." -ForegroundColor Red
            Write-Host "Fix (durable): allow the 'vEthernet (WSL ...)' adapter in your firewall app," -ForegroundColor Yellow
            Write-Host "  or run elevated: Set-NetFirewallHyperVVMSetting -Name '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}' -DefaultInboundAction Allow; wsl --shutdown" -ForegroundColor Yellow
            Write-Host "Or just use Docker: re-run setup and pick 'docker'." -ForegroundColor Yellow
        } else {
            Write-Host "Most common causes on Windows:" -ForegroundColor Red
            Write-Host "  * An orphan 'win-sshproxy'/'gvproxy' process holds the SSH pipe." -ForegroundColor Red
            Write-Host "  * Docker Desktop is running and holds the default Docker API pipe." -ForegroundColor Red
            Write-Host "  * A firewall/VPN (Avast, Norton, corporate) blocks the WSL adapter." -ForegroundColor Red
            Write-Host "Try: quit Docker Desktop, then 'podman machine stop; podman machine start'." -ForegroundColor Red
            Write-Host "Or just use Docker: re-run setup and pick 'docker'." -ForegroundColor Red
        }
        Write-Host "Logs: podman machine logs" -ForegroundColor Red
        exit 1
    }
    Write-Host ""
    Write-Host "Podman ready. Verify: podman ps"
} else {
    if (Get-Command docker -ErrorAction SilentlyContinue) {
        Write-Host "docker already installed: $((Get-Command docker).Source)"
    } else {
        winget install --id Docker.DockerDesktop -e --source winget --accept-source-agreements --accept-package-agreements
        if ($LASTEXITCODE -ne 0) {
            Write-Host "winget install failed (exit $LASTEXITCODE)" -ForegroundColor Red
            exit 1
        }
    }
    Write-Host ""
    Write-Host "Launch Docker Desktop from the Start menu to start the daemon (Docker Desktop is a GUI app and must be running before 'codetainyrrr task run')."
}
Write-Host ""
Write-Host "Installed $choice. Re-run 'codetainyrrr setup' or 'codetainyrrr task doctor' to verify."
"""

# ── task.list ───────────────────────────────────────────────────────────────
# List every configured container (~/.codetainyrrr/containers/<name>.env) with
# its CLI, runtime, and live status. The file stem IS the container + volume
# name (setup writes containers/<CONTAINER_NAME>.env). Read-only.

[task.list]
description = "List configured containers and their status"

[[task.list.steps]]
type   = "shell"
script = """
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker; fi
fi
echo "codetainyrrr containers:"
found=0
for f in "$__CD/containers/"*.env; do
    [ -f "$f" ] || continue
    found=1
    NAME="$(basename "$f" .env)"
    CLI="$(sed -n 's/^CODING_CLI=//p' "$f" | head -1 | tr -d '\"')"
    RT="$(sed -n 's/^CODETAINYRRR_RUNTIME=//p' "$f" | head -1 | tr -d '\"')"
    STATUS="stopped"
    if [ -n "$RUNTIME" ] && [ -n "$("$RUNTIME" ps -q --filter "name=^${NAME}$" 2>/dev/null)" ]; then STATUS="running"; fi
    printf '  %-22s cli=%-12s runtime=%-8s %s\\n' "$NAME" "${CLI:-?}" "${RT:-auto}" "$STATUS"
done
if [ "$found" = "0" ]; then
    if [ -f "$__CD/.env" ]; then echo "  (legacy single-container config at ~/.codetainyrrr/.env)"
    else echo "  (none — run 'codetainyrrr setup' to create one)"; fi
fi
echo ""
echo "Start one with: codetainyrrr task run <name>"
"""

[[task.list.os.windows]]
type   = "shell"
script = """
$body = @'
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker; fi
fi
echo "codetainyrrr containers:"
found=0
for f in "$__CD/containers/"*.env; do
    [ -f "$f" ] || continue
    found=1
    NAME="$(basename "$f" .env)"
    CLI="$(sed -n 's/^CODING_CLI=//p' "$f" | head -1 | tr -d '\"')"
    RT="$(sed -n 's/^CODETAINYRRR_RUNTIME=//p' "$f" | head -1 | tr -d '\"')"
    STATUS="stopped"
    if [ -n "$RUNTIME" ] && [ -n "$("$RUNTIME" ps -q --filter "name=^${NAME}$" 2>/dev/null)" ]; then STATUS="running"; fi
    printf '  %-22s cli=%-12s runtime=%-8s %s\\n' "$NAME" "${CLI:-?}" "${RT:-auto}" "$STATUS"
done
if [ "$found" = "0" ]; then
    if [ -f "$__CD/.env" ]; then echo "  (legacy single-container config at ~/.codetainyrrr/.env)"
    else echo "  (none - run 'codetainyrrr setup' to create one)"; fi
fi
echo ""
echo "Start one with: codetainyrrr task run <name>"
'@
$tmp = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString() + ".sh")
[System.IO.File]::WriteAllText($tmp, $body)
$env:MSYS_NO_PATHCONV = '1'; $env:MSYS2_ARG_CONV_EXCL = '*'
try { sh $tmp } finally { Remove-Item $tmp -ErrorAction SilentlyContinue }
"""

