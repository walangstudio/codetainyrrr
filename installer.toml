# (the auto-fallback) keep-id is invalid, so we omit it too — entrypoint
# defaults to 1000, same as docker.
PODMAN_ROOTFUL=""
if [ "$RUNTIME" = "podman" ]; then
    PODMAN_ROOTFUL="$(podman machine inspect --format '{% raw %}{{.Rootful}}{% endraw %}' 2>/dev/null || true)"
fi
args+=(-e "CODING_CLI=${CODING_CLI}")
args+=(-e "INSTALL_TOOLS=${INSTALL_TOOLS}")
args+=(-e "INSTALL_PLUGINS=${INSTALL_PLUGINS}")
if [ "$RUNTIME" = "podman" ] && [ "${PODMAN_ROOTFUL}" != "true" ]; then
    args+=(--userns=keep-id)
fi
args+=(-e "WIRE_CCSTATUSLINE=${WIRE_CCSTATUSLINE:-true}")
args+=(-e "GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}" -e "GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}")
args+=(-e "GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME}" -e "GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL}")
if [ -n "${PROJECT_DIR_NORM}" ]; then
    args+=(--workdir "/workspace/${PROJ_BASE}")
else
    args+=(--workdir /workspace)
fi

args+=("${IMAGE}")
exec "$RUNTIME" "${args[@]}"
