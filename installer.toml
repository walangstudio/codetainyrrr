# Land in the mounted project if given; else the workspace root /workspace.
if [ -n "${PROJECT_DIR_NORM}" ]; then
    args+=(--workdir "/workspace/${PROJ_BASE}")
else
    args+=(--workdir /workspace)
fi

args+=("${IMAGE}")
exec "$RUNTIME" "${args[@]}"
