# Windows variant: PowerShell delegates the POSIX body to Git Bash sh via a
# temp file. Docker Desktop puts sh.exe on PATH. Forward slashes work for
# Docker volume specs on Windows. Path backslash normalisation uses tr as on Linux.
[[task.run.os.windows]]
type   = "shell"
script = """
$body = @'
set -a
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"
set +a
set -e
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker
    else
        echo "Error: neither 'podman' nor 'docker' found on PATH." >&2
        echo "Install one (recommended: podman) or run: codetainyrrr task install-runtime" >&2
        exit 1
    fi
fi
CONTAINER="${CONTAINER_NAME:-{{ container_name }}}"
IMAGE="{{ image_tag }}"
# exe_dir is a Windows path; normalise backslashes. Binary + config are
# co-located by the installer, so the config dir is exe_dir itself.
CFG_DIR="$(printf '%s' "{{ exe_dir | default('') }}" | tr '\\\\' '/')"

WANT_CFG="cli=${CODING_CLI};proj=${PROJECT_DIR};extra=${EXTRA_WORKSPACES}"
if [ -n "$("$RUNTIME" ps -q --filter "name=^${CONTAINER}$")" ]; then
    HAVE_CFG="$("$RUNTIME" inspect --format '{% raw %}{{ index .Config.Labels "ct.cfg" }}{% endraw %}' "${CONTAINER}" 2>/dev/null || true)"
    if [ "${HAVE_CFG}" = "${WANT_CFG}" ]; then
        exec "$RUNTIME" exec -it -u dev "${CONTAINER}" zsh
    fi
    echo "Settings changed; recreating ${CONTAINER} (was ${HAVE_CFG:-unlabeled})."
    "$RUNTIME" rm -f "${CONTAINER}" >/dev/null 2>&1 || true
fi

# argv array - values with spaces never word-split.
args=(run --rm -it --name "${CONTAINER}" --hostname "${CONTAINER}")
args+=(--label "ct.cfg=${WANT_CFG}")
args+=(-v "${CONTAINER}_ct_home:/home/dev")
args+=(--cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID)
args+=(--security-opt no-new-privileges:true)
"$RUNTIME" network inspect codetainyrrr_default >/dev/null 2>&1 || \
    "$RUNTIME" network create codetainyrrr_default >/dev/null
args+=(--network codetainyrrr_default)

PROJECT_DIR_NORM="$(printf '%s' "${PROJECT_DIR}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '\\\\' '/' | sed 's|/*$||')"
PROJ_BASE=""
if [ -n "${PROJECT_DIR_NORM}" ]; then
    PROJ_BASE="${PROJECT_DIR_NORM##*/}"
    case "${PROJ_BASE}" in ""|*:) PROJ_BASE="project" ;; esac
    args+=(-v "${PROJECT_DIR_NORM}:/workspace/${PROJ_BASE}")
fi

if [ -n "${EXTRA_WORKSPACES}" ]; then
    USED="${PROJ_BASE}"
    IFS=';' read -ra WS_LIST <<< "${EXTRA_WORKSPACES}"
    for RAW in "${WS_LIST[@]}"; do
        HOST="$(printf '%s' "${RAW}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '\\\\' '/' | sed 's|/*$||')"
        [ -z "${HOST}" ] && continue
        BASE="${HOST##*/}"
        case "${BASE}" in ""|*:) continue ;; esac
