# ── task.doctor ───────────────────────────────────────────────────────────────
# Mirrors cmd/doctor.rs: checks Docker is reachable, the image exists, and
# the container status. The Rust version iterated catalog items and checked
# sentinel state (host-side registry.status). That host-side sentinel walk
# is not portable here — listed explicitly as an unported capability below.

[task.doctor]
description = "Check Docker daemon, image, and container health"

# Docker Go templates use {{ }} which conflicts with minijinja. Escape them
# with {% raw %}...{% endraw %} blocks around the --format arguments.
[[task.doctor.steps]]
type   = "shell"
script = """
set -a
[ -f "${HOME}/.codetainyrrr/.env" ] && . "${HOME}/.codetainyrrr/.env"
set +a
CONTAINER="${CONTAINER_NAME:-{{ container_name }}}"
set -e
echo "=== docker info ==="
docker info --format {% raw %}"Server Version: {{.ServerVersion}}"{% endraw %}
echo ""
echo "=== image: {{ image_tag }} ==="
if docker images -q {{ image_tag }} | grep -q .; then
    docker image inspect --format {% raw %}"  created: {{.Created}}  size: {{.Size}}"{% endraw %} {{ image_tag }}
    echo "  status: present"
else
    echo "  status: NOT FOUND — run 'codetainyrrr task build' to build"
fi
echo ""
echo "=== container: ${CONTAINER} ==="
if docker ps -q --filter "name=^${CONTAINER}$" | grep -q .; then
    docker inspect --format {% raw %}"  state: {{.State.Status}}  started: {{.State.StartedAt}}"{% endraw %} "${CONTAINER}"
elif docker ps -aq --filter "name=^${CONTAINER}$" | grep -q .; then
    docker inspect --format {% raw %}"  state: {{.State.Status}} (stopped)"{% endraw %} "${CONTAINER}"
else
    echo "  state: not created"
fi
"""

# Windows: PowerShell delegates the POSIX body to Git Bash sh via a temp file.
[[task.doctor.os.windows]]
