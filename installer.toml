# codetainyrrr installer.toml — config-driven by the insmaller engine.
#
# settings, desugar, recipe, and plugin blocks are VERBATIM from the sibling
# insmaller/installer.toml (parity guarantee). Task pipelines port the Docker
# lifecycle from crates/codetainyrrr/src/cmd/*.rs and docker-compose.yml.

# ── settings ──────────────────────────────────────────────────────────────────

[settings]
sentinel_dir_name = "codetainyrrr"
# setup only collects config + writes setup_output; it never installs on the
# host. The catalog's install scripts are Linux/container scripts run by the
# container entrypoint (INSTALL_TOOLS/INSTALL_PLUGINS), never on the host shell.
# (insmaller >=0.4.0)
setup_writes_config_only = true
# End setup with a default-yes "Run codetainyrrr now? [Y/n]" prompt that launches
# `task run` in-process (which auto-installs the runtime + builds the image first).
# Skipped on non-TTY / --answers runs unless --run is passed. (insmaller >=0.9.0)
setup_then_task = "run"
path_globs = [
  "~/.local/bin",
  "~/.cargo/bin",
  "~/.deno/bin",
  "~/.bun/bin",
  "~/.dotnet",
  "~/go/sdk/bin",
  "~/.sdkman/candidates/java/current/bin",
  "~/.nvm/versions/node/*/bin",
]

catalog = "catalog.json"
wizard  = "wizard.toml"
# Prefill the wizard on "edit" from the picked container's saved settings
# (insmaller >= 0.13.0). ${CONTAINER_NAME} resolves once the pick page sets it;
# a not-yet-existing file (new container) is a no-op, and saved secrets show as
# (kept) — preserved unless re-typed.
defaults_from_file = "~/.codetainyrrr/containers/${CONTAINER_NAME}.env"

[settings.setup_output]
# Per-container settings file; {{ CONTAINER_NAME }} is templated against the
# wizard answers (engine >= 0.13.0). Each container gets its own file alongside
# its own <name>_ct_home volume, so multiple containers coexist. The legacy
# single ~/.codetainyrrr/.env still works for pre-existing single-container setups.
path   = "~/.codetainyrrr/containers/{{ CONTAINER_NAME }}.env"
format = "env"
header = "codetainyrrr container configuration"
mode   = 0o600

# ── project ───────────────────────────────────────────────────────────────────

[project]
name             = "codetainyrrr"
about            = "AI coding container — setup, run, manage"
version          = "0.2.0"
copyright        = "© 2026 walang.studio"
# Rendered by `--version` (insmaller >= 0.10.0). Style filters emit ANSI on a
# TTY, plain text when piped; older engines ignore these fields and just print
# the engine version.
version_template = """
{{ name | gradient("818cf8", "f472b6") | bold }} {{ version }} 🐾
{{ about | dim }}
{{ copyright }} · {{ extra.license }}
{{ ("engine: insmaller " ~ engine_version) | gray }}"""
default_cli      = "claude"
group_order      = [
  "Coding Tools",
  "Frameworks",
  "Shell Tools",
  "Coding CLI Plugins",
  "SDD / Orchestration",
  "Memory & Knowledge",
]
intro_template   = "  codetainyrrr  ·  setup  "
outro_template   = "Saved to ~/.codetainyrrr/containers/{{ CONTAINER_NAME }}.env  ·  start it with: codetainyrrr task run {{ CONTAINER_NAME }}"

[project.extra]
license          = "MIT"
image_tag        = "codetainyrrr:local"
container_name   = "codetainyrrr"
ready_file       = "/tmp/codetainyrrr.ready"
etc_dir          = "/etc/codetainyrrr"
env_header       = "# codetainyrrr configuration"
home_volume      = "codetainyrrr_ct_home"

# ── desugar ───────────────────────────────────────────────────────────────────
# VERBATIM from insmaller/installer.toml

[[desugar]]
prefix = "npm:"
recipe = "npm-global"
parse  = "rest_verbatim"

[[desugar]]
prefix = "apt:"
recipe = "apt-get"
parse  = "rest_verbatim"

[[desugar]]
prefix = "uv:"
recipe = "uv-tool"
parse  = "uv_spec"

[[desugar]]
prefix = "nvm:"
recipe = "nvm-node"
parse  = "nvm_version"

[[desugar]]
prefix = "sdkman:"
recipe = "sdkman-candidate"
parse  = "single_arg"

[[desugar]]
prefix = "corepack:"
recipe = "corepack-prepare"
parse  = "single_arg"

[[desugar]]
prefix = "go:"
recipe = "go-toolchain"
parse  = "single_arg"

[[desugar]]
prefix = "python:"
recipe = "python-tools"
parse  = "single_arg"

[[desugar]]
prefix = "gh:"
recipe = "gh-release"
parse  = "gh_repo_asset"

[[desugar]]
prefix = "git:"
recipe = "git-clone"
parse  = "git_url_dest"

[[desugar]]
prefix = "merge-json:"
recipe = "merge-json"
parse  = "merge_json_spec"

[[desugar]]
prefix = "marketplace:"
recipe = "marketplace"
parse  = "marketplace_spec"

[[desugar]]
prefix = ""
recipe = "shell-pipe"
parse  = "shell_literal"

# ── recipes ───────────────────────────────────────────────────────────────────
# VERBATIM from insmaller/installer.toml

[[recipe]]
name = "npm-global"
[[recipe.install]]
type    = "exec"
program = "npm"
argline = "install -g {{ packages }}"
[[recipe.uninstall]]
type    = "exec"
program = "npm"
argline = "uninstall -g {{ packages }}"

[[recipe]]
name = "apt-get"
[[recipe.install]]
type   = "shell"
script = "sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y {{ packages }}"
[[recipe.uninstall]]
type   = "shell"
script = "sudo apt-get remove -y {{ packages }}"

[[recipe]]
name = "uv-tool"
[[recipe.install]]
type    = "exec"
program = "uv"
argline = "tool install {{ package }}{% if from %} --from {{ from }}{% endif %}"
[[recipe.uninstall]]
type    = "exec"
program = "uv"
argline = "tool uninstall {{ package }}"

[[recipe]]
name = "nvm-node"
[[recipe.install]]
type   = "shell"
script = """
set -e
export NVM_DIR="$HOME/.nvm"
if [ ! -f "$NVM_DIR/nvm.sh" ]; then
    curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
fi
. "$NVM_DIR/nvm.sh"
nvm install {{ install_arg }}
nvm alias default '{{ alias_target }}'
nvm use default
node --version
npm --version
"""
[[recipe.uninstall]]
type   = "shell"
script = """
export NVM_DIR="$HOME/.nvm"
[ -f "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm uninstall '{{ alias_target }}' || true
"""

[[recipe]]
name = "sdkman-candidate"
[[recipe.install]]
type   = "shell"
script = """
set -e
export SDKMAN_DIR="$HOME/.sdkman"
if [ ! -f "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
    curl -fsSL https://get.sdkman.io | bash
fi
. "$SDKMAN_DIR/bin/sdkman-init.sh"
sdk install {{ arg }}
"""
[[recipe.uninstall]]
type   = "shell"
script = """
export SDKMAN_DIR="$HOME/.sdkman"
[ -f "$SDKMAN_DIR/bin/sdkman-init.sh" ] || { echo "sdkman not installed; skipping" >&2; exit 0; }
. "$SDKMAN_DIR/bin/sdkman-init.sh"
_ver="$(sdk current {{ arg }} 2>/dev/null | awk '{print $NF}')"
[ -n "$_ver" ] && sdk uninstall {{ arg }} "$_ver" < /dev/null || true
"""

[[recipe]]
name = "corepack-prepare"
[[recipe.install]]
type    = "exec"
program = "corepack"
argline = "prepare {{ arg }}@latest --activate"
[[recipe.uninstall]]
type    = "exec"
program = "corepack"
argline = "disable {{ arg }}"

[[recipe]]
name = "go-toolchain"
[[recipe.install]]
type        = "shell"
script_file = "recipes/go-toolchain.sh"
[[recipe.uninstall]]
type   = "shell"
script = """
# Remove the Go SDK directory that the go-toolchain recipe installs.
# The official install script puts the SDK under $HOME/go/sdk/go<version>
# (per path_globs entry "~/go/sdk/bin" in [settings]) and symlinks the
# active toolchain to $HOME/go.  Remove all versioned SDK dirs + the
# top-level go/ tree.  Does NOT remove user project files; $GOPATH/src
# and $GOPATH/pkg/mod are left untouched.
rm -rf "$HOME/go/sdk"
rm -rf "$HOME/go/bin"
rm -rf "$HOME/go/pkg/tool"
# Remove the go/go<version> root if it matches the sdk pattern (no user data there).
find "$HOME/go" -maxdepth 1 -name 'go[0-9]*' -type d -exec rm -rf {} + 2>/dev/null || true
"""

[[recipe]]
name = "python-tools"
[[recipe.install]]
type        = "shell"
script_file = "recipes/python-tools.sh"
[[recipe.uninstall]]
type        = "shell"
script_file = "recipes/python-tools-uninstall.sh"

[[recipe]]
name = "gh-release"
[[recipe.install]]
type        = "shell"
script_file = "recipes/gh-release.sh"
[[recipe.uninstall]]
type   = "shell"
script = 'rm -f "$HOME/.local/bin/{{ key }}"'

[[recipe]]
name = "git-clone"
[[recipe.install]]
type   = "shell"
script = """
if [ -d "{{ dest }}/.git" ]; then
    echo "git-clone: {{ dest }} already a git checkout, skipping" >&2
    exit 0
fi
git clone --depth=1 {{ url }} "{{ dest }}"
"""
[[recipe.uninstall]]
type   = "shell"
script = 'rm -rf "{{ dest }}"'

[[recipe]]
name = "merge-json"
[[recipe.install]]
type    = "merge_json"
target  = "{{ target }}"
command = "{{ command }}"

[[recipe]]
name = "marketplace"
[[recipe.install]]
type      = "check_command"
program   = "claude"
on_missing = "plugin '{{ plugin }}' is a Claude Code marketplace plugin but 'claude' is not installed. Set CODING_CLI=claude or remove it."
[[recipe.install]]
type    = "exec"
program = "claude"
argline = "plugin marketplace add {{ repo }}"
[[recipe.install]]
type    = "exec"
program = "claude"
argline = "plugin install {{ plugin }}@{{ marketplace }}"
[[recipe.uninstall]]
type    = "exec"
program = "claude"
argline = "plugin uninstall {{ plugin }}"

[[recipe]]
name = "shell-pipe"
[[recipe.install]]
type   = "shell"
script = "{{ script }}"

# ── recipe-pack plugins ───────────────────────────────────────────────────────
# VERBATIM from insmaller/installer.toml

[[plugin]]
name = "sys-pkg"
path = "plugins/sys-pkg"

[[plugin]]
name = "lang-pkg"
path = "plugins/lang-pkg"

# ── tasks ─────────────────────────────────────────────────────────────────────
# Port of crates/codetainyrrr/src/cmd/{run,reset,doctor}.rs and docker-compose.yml.
#
# Variable contract:
#   minijinja ({{ }}) — ONLY [project.extra] keys that are always defined:
#     image_tag, container_name, ready_file, etc_dir, env_header
#   shell runtime — ALL wizard-derived values sourced from ~/.codetainyrrr/.env:
#     CODING_CLI, CONTAINER_NAME, PROJECT_DIR, EXTRA_WORKSPACES,
#     CLAUDE_DIR, CLAUDE_JSON, GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL,
#     INSTALL_TOOLS, INSTALL_PLUGINS, CCSTATUSLINE_CONFIG,
#     ZSH_EXTRA_CONFIG, STARSHIP_CONFIG,
#     ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY
#
# Every task script that needs wizard vars sources the env file first:
#   set -a; __CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"; set +a
#
# CONTAINER_NAME: prefer the user's .env value, fall back to project.extra default:
#   "${CONTAINER_NAME:-{{ container_name }}}"
#
# Per-OS overrides only where the invocation genuinely differs
# (Windows path quoting for volume specs).

# ── task.build ────────────────────────────────────────────────────────────────
# "build" = ensure the image is present. Installed users have no Dockerfile/
# context — the image ships prebuilt as codetainyrrr-image.tar.gz beside the
# config (copied into the install dir by the installer's stage-payload). So:
# inspect the image; if absent, `docker load` the bundled tarball. The image is
# produced once by CI (release.yml `image` job via `docker build` + `docker save`).
# task.run `needs = ["build"]`, so the load happens transparently on first run.

[task.build]
description = "Ensure the codetainyrrr image is loaded (loads the bundled tarball if missing)"

[[task.build.steps]]
type   = "shell"
script = """
set -a
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"
set +a
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker
    else
        echo "Error: neither 'podman' nor 'docker' found on PATH." >&2
        echo "Install one (recommended: podman) or run: codetainyrrr task install-runtime" >&2
        exit 1
    fi
fi
if "$RUNTIME" image inspect {{ image_tag }} >/dev/null 2>&1; then
    exit 0
fi
IMG="{{ exe_dir | default('') }}/codetainyrrr-image.tar.gz"
if [ -f "$IMG" ]; then
    echo "Loading image {{ image_tag }} from $IMG via $RUNTIME ..."
    "$RUNTIME" load -i "$IMG"
else
    echo "Image {{ image_tag }} not loaded and no tarball at $IMG." >&2
    echo "Re-run 'codetainyrrr task install' from the extracted bundle." >&2
    exit 1
fi
"""

[[task.build.os.windows]]
type   = "shell"
script = """
$body = @'
set -a
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"
set +a
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker
    else
        echo "Error: neither 'podman' nor 'docker' found on PATH." >&2
        echo "Install one (recommended: podman) or run: codetainyrrr task install-runtime" >&2
        exit 1
    fi
fi
if "$RUNTIME" image inspect {{ image_tag }} >/dev/null 2>&1; then
    exit 0
fi
IMG="$(printf '%s' "{{ exe_dir | default('') }}" | tr '\\\\' '/')/codetainyrrr-image.tar.gz"
if [ -f "$IMG" ]; then
    echo "Loading image {{ image_tag }} from $IMG via $RUNTIME ..."
    "$RUNTIME" load -i "$IMG"
else
    echo "Image {{ image_tag }} not loaded and no tarball at $IMG." >&2
    echo "Re-run 'codetainyrrr task install' from the extracted bundle." >&2
    exit 1
fi
'@
$tmp = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString() + ".sh")
[System.IO.File]::WriteAllText($tmp, $body)
# Stop MSYS/Git-Bash from rewriting POSIX container paths (/workspace, /home/dev,
# /etc/codetainyrrr, /tmp/...) into Windows paths when sh calls native docker.exe.
$env:MSYS_NO_PATHCONV = '1'; $env:MSYS2_ARG_CONV_EXCL = '*'
try { sh $tmp } finally { Remove-Item $tmp -ErrorAction SilentlyContinue }
"""

# ── task.run ──────────────────────────────────────────────────────────────────
# Builds the `$RUNTIME run` argv as a bash array (spaces in paths/values never
# word-split), then `exec "$RUNTIME" "${args[@]}"`. $RUNTIME is podman or docker,
# resolved from .env or auto-detected on PATH:
#   - named volume <container_name>_ct_home → /home/dev
#   - PROJECT_DIR → /workspace/<basename>, --workdir /workspace/<basename> (skipped when empty)
#   - EXTRA_WORKSPACES semicolon list → /workspace/<basename> each
#   - host ~/.codetainyrrr/{catalog.json,wizard.toml} (via {{ exe_dir }}) bind-mounted
#     RO over the baked copies — live edits without a rebuild
#   - CLAUDE_DIR → /home/dev/.claude, CLAUDE_JSON → /home/dev/.claude.json (RO, when set)
#   - BYO config files (CCSTATUSLINE_CONFIG, ZSH_EXTRA_CONFIG, STARSHIP_CONFIG) RO staged
#   - HOST_UID/GID (POSIX), WIRE_CCSTATUSLINE, GIT_AUTHOR_*/GIT_COMMITTER_*, API keys via -e
#
# Windows runs the same bash body via Git Bash sh (temp file); it omits
# HOST_UID/GID (git-bash uid ≠ container uid; entrypoint defaults to 1000).
# Backslash normalisation: `tr \\ /`.
#
# NOTE: EXTRA_WORKSPACES semicolon-split and basename dedup logic from run.rs
# cannot be reproduced faithfully in a single shell one-liner without a loop.
# The loop below is a direct port; it handles blanks and basename collisions
# exactly as the Rust code does.

[task.run]
description = "Start the codetainyrrr container (installs runtime + builds image first if needed)"
needs       = ["install-runtime", "build"]

[[task.run.steps]]
type   = "shell"
script = """
set -a
__CD="${HOME}/.codetainyrrr"; [ -d "$__CD" ] || __CD="$(printf '%s' "${USERPROFILE:-}" | tr '\\\\' '/')/.codetainyrrr"; if [ -n "${CT_ARG:-}" ] && [ -f "$__CD/containers/${CT_ARG}.env" ]; then __E="$__CD/containers/${CT_ARG}.env"; elif [ -n "$(ls "$__CD/containers/"*.env 2>/dev/null)" ]; then __E="$(ls -t "$__CD/containers/"*.env 2>/dev/null | head -1)"; else __E="$__CD/.env"; fi; [ -f "$__E" ] && . "$__E"
set +a
set -e
RUNTIME="${CODETAINYRRR_RUNTIME:-}"
if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "auto" ]; then
    if command -v podman >/dev/null 2>&1; then RUNTIME=podman
    elif command -v docker >/dev/null 2>&1; then RUNTIME=docker
    else
        echo "Error: neither 'podman' nor 'docker' found on PATH." >&2
        echo "Install one (recommended: podman) or run: codetainyrrr task install-runtime" >&2
        exit 1
    fi
fi
CONTAINER="${CONTAINER_NAME:-{{ container_name }}}"
IMAGE="{{ image_tag }}"
# Installed config dir (host) = the binary's own dir — the installer co-locates
# the binary with its config. default('') guards a rare current_exe() failure.
CFG_DIR="{{ exe_dir | default('') }}"

# Reconnect to the live container only when it was started with the current
# settings; otherwise recreate it so re-setup changes (e.g. a different
# CODING_CLI) take effect. The _ct_home named volume persists across recreate.
WANT_CFG="cli=${CODING_CLI};proj=${PROJECT_DIR};extra=${EXTRA_WORKSPACES}"
if [ -n "$("$RUNTIME" ps -q --filter "name=^${CONTAINER}$")" ]; then
    HAVE_CFG="$("$RUNTIME" inspect --format '{% raw %}{{ index .Config.Labels "ct.cfg" }}{% endraw %}' "${CONTAINER}" 2>/dev/null || true)"
    if [ "${HAVE_CFG}" = "${WANT_CFG}" ]; then
        exec "$RUNTIME" exec -it -u dev "${CONTAINER}" zsh
    fi
    echo "Settings changed; recreating ${CONTAINER} (was ${HAVE_CFG:-unlabeled})."
    "$RUNTIME" rm -f "${CONTAINER}" >/dev/null 2>&1 || true
fi

# Build argv as an array so paths/values containing spaces never word-split.
args=(run --rm -it --name "${CONTAINER}" --hostname "${CONTAINER}")
args+=(--label "ct.cfg=${WANT_CFG}")
args+=(-v "${CONTAINER}_ct_home:/home/dev")

# Security hardening (mirrors the old docker-compose.yml): drop ALL caps,
# re-add only the three the entrypoint's gosu drop needs (none survive exec),
# and forbid privilege escalation.
args+=(--cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID)
args+=(--security-opt no-new-privileges:true)
"$RUNTIME" network inspect codetainyrrr_default >/dev/null 2>&1 || \
    "$RUNTIME" network create codetainyrrr_default >/dev/null
args+=(--network codetainyrrr_default)

# Primary project → /workspace/<basename> (e.g. c:\temp → /workspace/temp); skip if empty.
PROJECT_DIR_NORM="$(printf '%s' "${PROJECT_DIR}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '\\\\' '/' | sed 's|/*$||')"
PROJ_BASE=""
if [ -n "${PROJECT_DIR_NORM}" ]; then
    PROJ_BASE="${PROJECT_DIR_NORM##*/}"
    case "${PROJ_BASE}" in ""|*:) PROJ_BASE="project" ;; esac
    args+=(-v "${PROJECT_DIR_NORM}:/workspace/${PROJ_BASE}")
fi

# EXTRA_WORKSPACES: ';'-separated, each → /workspace/<basename>, dedup basenames.
# Seed USED with the project basename so an extra with the same basename is skipped.
if [ -n "${EXTRA_WORKSPACES}" ]; then
    USED="${PROJ_BASE}"
    IFS=';' read -ra WS_LIST <<< "${EXTRA_WORKSPACES}"
    for RAW in "${WS_LIST[@]}"; do
        HOST="$(printf '%s' "${RAW}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '\\\\' '/' | sed 's|/*$||')"
        [ -z "${HOST}" ] && continue
        BASE="${HOST##*/}"
        case "${BASE}" in ""|*:) continue ;; esac
        printf '%s\\n' "${USED}" | grep -qx "${BASE}" && continue
        USED="${USED}
${BASE}"
        args+=(-v "${HOST}:/workspace/${BASE}")
    done
fi

# Live-edit overrides: host ~/.codetainyrrr/{catalog.json,wizard.toml} shadow the
# baked copies without a rebuild. Skipped when absent (e.g. run from a bundle).
[ -f "${CFG_DIR}/catalog.json" ] && args+=(-v "${CFG_DIR}/catalog.json:/etc/codetainyrrr/catalog.json:ro")
[ -f "${CFG_DIR}/wizard.toml" ]  && args+=(-v "${CFG_DIR}/wizard.toml:/etc/codetainyrrr/wizard.toml:ro")

# CLAUDE_DIR override (RO ~/.claude).
CLAUDE_NORM="$(printf '%s' "${CLAUDE_DIR}" | tr '\\\\' '/')"
[ -n "${CLAUDE_NORM}" ] && args+=(-v "${CLAUDE_NORM}:/home/dev/.claude:ro")
CLAUDE_JSON_NORM="$(printf '%s' "${CLAUDE_JSON}" | tr '\\\\' '/')"
[ -n "${CLAUDE_JSON_NORM}" ] && [ -f "${CLAUDE_JSON_NORM}" ] && args+=(-v "${CLAUDE_JSON_NORM}:/home/dev/.claude.json:ro")

# BYO config staging mounts (entrypoint copies them in on first start).
CC_NORM="$(printf '%s' "${CCSTATUSLINE_CONFIG}" | tr '\\\\' '/')"
ZSH_NORM="$(printf '%s' "${ZSH_EXTRA_CONFIG}" | tr '\\\\' '/')"
STAR_NORM="$(printf '%s' "${STARSHIP_CONFIG}" | tr '\\\\' '/')"
[ -n "${CC_NORM}" ]   && [ -f "${CC_NORM}" ]   && args+=(-v "${CC_NORM}:/etc/codetainyrrr/user-ccstatusline.json:ro")
[ -n "${ZSH_NORM}" ]  && [ -f "${ZSH_NORM}" ]  && args+=(-v "${ZSH_NORM}:/etc/codetainyrrr/user-zshrc-extra.zsh:ro")
[ -n "${STAR_NORM}" ] && [ -f "${STAR_NORM}" ] && args+=(-v "${STAR_NORM}:/etc/codetainyrrr/user-starship.toml:ro")

# API keys (only when set).
