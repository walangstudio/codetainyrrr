        USED="${USED}
${BASE}"
        args+=(-v "${HOST}:/workspace/${BASE}")
    done
fi

[ -f "${CFG_DIR}/catalog.json" ] && args+=(-v "${CFG_DIR}/catalog.json:/etc/codetainyrrr/catalog.json:ro")
[ -f "${CFG_DIR}/wizard.toml" ]  && args+=(-v "${CFG_DIR}/wizard.toml:/etc/codetainyrrr/wizard.toml:ro")

CLAUDE_NORM="$(printf '%s' "${CLAUDE_DIR}" | tr '\\\\' '/')"
[ -n "${CLAUDE_NORM}" ] && args+=(-v "${CLAUDE_NORM}:/home/dev/.claude:ro")
CLAUDE_JSON_NORM="$(printf '%s' "${CLAUDE_JSON}" | tr '\\\\' '/')"
[ -n "${CLAUDE_JSON_NORM}" ] && [ -f "${CLAUDE_JSON_NORM}" ] && args+=(-v "${CLAUDE_JSON_NORM}:/home/dev/.claude.json:ro")
CC_NORM="$(printf '%s' "${CCSTATUSLINE_CONFIG}" | tr '\\\\' '/')"
ZSH_NORM="$(printf '%s' "${ZSH_EXTRA_CONFIG}" | tr '\\\\' '/')"
STAR_NORM="$(printf '%s' "${STARSHIP_CONFIG}" | tr '\\\\' '/')"
[ -n "${CC_NORM}" ]   && [ -f "${CC_NORM}" ]   && args+=(-v "${CC_NORM}:/etc/codetainyrrr/user-ccstatusline.json:ro")
[ -n "${ZSH_NORM}" ]  && [ -f "${ZSH_NORM}" ]  && args+=(-v "${ZSH_NORM}:/etc/codetainyrrr/user-zshrc-extra.zsh:ro")
[ -n "${STAR_NORM}" ] && [ -f "${STAR_NORM}" ] && args+=(-v "${STAR_NORM}:/etc/codetainyrrr/user-starship.toml:ro")

[ -n "${ANTHROPIC_API_KEY}" ]  && args+=(-e "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}")
[ -n "${OPENAI_API_KEY}" ]     && args+=(-e "OPENAI_API_KEY=${OPENAI_API_KEY}")
[ -n "${OPENROUTER_API_KEY}" ] && args+=(-e "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}")
[ -n "${GEMINI_API_KEY}" ]     && args+=(-e "GEMINI_API_KEY=${GEMINI_API_KEY}")

