# ── task.reset ────────────────────────────────────────────────────────────────
# Mirrors cmd/reset.rs::reset_full: stop container (ignore errors), remove the
# named home volume. The interactive "type RESET" prompt can't be reproduced
# (engine shell steps have no interactive stdin), so the guard is an explicit
# confirm env var: the first step aborts unless CODETAINYRRR_CONFIRM=RESET.
#
# NOTE: The Rust reset also clears sentinel files (host-side) for plugins_only
# mode. That host-side sentinel walk is not ported here (see unported list).

[task.reset]
description = "DESTRUCTIVE: stop container and remove the home volume (prompts for confirmation; non-TTY: set CODETAINYRRR_CONFIRM=RESET)"

# Confirmation gate — insmaller's `input` step kind (>=0.5.0). On a TTY it
# prompts the user; non-TTY falls back to env CODETAINYRRR_CONFIRM. `confirm`
# fails the step on mismatch, so the destructive steps below never run.
# OS-agnostic, but duplicated in `os.windows` below because that block REPLACES
# the default steps array on Windows (insmaller picks one set per platform).
[[task.reset.steps]]
type    = "input"
name    = "CODETAINYRRR_CONFIRM"
message = "Type RESET to permanently delete the home volume (CLIs, shell history, ~/.claude state):"
confirm = "RESET"

[[task.reset.steps]]
type              = "shell"
continue_on_error = true
script            = """
set -a
[ -f "${HOME}/.codetainyrrr/.env" ] && . "${HOME}/.codetainyrrr/.env"
set +a
docker stop "${CONTAINER_NAME:-{{ container_name }}}"
"""

[[task.reset.steps]]
type   = "shell"
script = """
set -a
[ -f "${HOME}/.codetainyrrr/.env" ] && . "${HOME}/.codetainyrrr/.env"
set +a
docker volume rm "${CONTAINER_NAME:-{{ container_name }}}_ct_home"
"""

