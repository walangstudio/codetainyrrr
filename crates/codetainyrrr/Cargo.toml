[package]
name = "codetainyrrr"
version = "0.1.0"
edition = "2024"
description = "AI coding container — setup, run, manage"
license = "MIT"

[[bin]]
name = "codetainyrrr"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config parsing
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# TUI — wizard flow
cliclack = "0.3"

# TUI — doctor/category multiselect
ratatui    = "0.29"
crossterm  = "0.28"

# Progress/spinners during install
indicatif = "0.17"

# Template rendering for {{cwd}}, ${VAR} etc.
minijinja = "2"

# Async runtime (for parallel installs, HTTP)
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "io-util", "macros"] }

# HTTP (downloading tarballs, GitHub releases)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Archive extraction
flate2 = "1"
tar    = "0.4"
zip    = "2"

# Async trait support
async-trait = "0.1"

# Date/time (sentinel timestamps)
chrono = { version = "0.4", features = ["serde"] }

# Console styling (used by cliclack themes)
console = "0.15"

# Error handling
anyhow  = "1"
thiserror = "1"

# Filesystem utilities
dirs     = "5"
walkdir  = "2"
tempfile = "3"

# Serialization helpers
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
